    <circle cx="355" cy="157" r="8" />
    <circle cx="396" cy="256" r="8" />
    <circle cx="355" cy="355" r="8" />
    <circle cx="256" cy="396" r="8" />
    <circle cx="157" cy="355" r="8" />
    <circle cx="116" cy="256" r="8" />
